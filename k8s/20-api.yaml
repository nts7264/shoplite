apiVersion: v1
kind: ConfigMap
metadata:
  name: shoplite-config
  namespace: shoplite
data:
  REDIS_HOST: redis
  APP_VERSION: v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shoplite
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # cập nhật không gián đoạn
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: 633212682575.dkr.ecr.ap-northeast-1.amazonaws.com/shoplite-api:v1
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: shoplite-config}}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shoplite
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
