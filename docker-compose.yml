services:
  api:
    build: .
    image: shoplite-api:v1
    ports: ["8080:8080"]
    environment:
      REDIS_HOST: redis
      APP_VERSION: v1
    depends_on:
      redis:
        condition: service_healthy     # chờ Redis thực sự sẵn sàng, không chỉ "đã start"
    networks: [shoplite]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # ghi AOF để dữ liệu bền
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [shoplite]
    restart: unless-stopped

networks:
  shoplite:

volumes:
  redis-data:
