version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
  build:
    commands:
      - docker build --pull -t $ECR_REGISTRY/shoplite-api:$SHA .
  post_build:
    commands:
      - docker push $ECR_REGISTRY/shoplite-api:$SHA
      - printf '[{"name":"api","imageUri":"%s"}]' $ECR_REGISTRY/shoplite-api:$SHA > imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
